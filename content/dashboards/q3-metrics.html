<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q3 Metrics Dashboard</title>
<meta name="description" content="A sample dashboard with KPI cards and a simple bar chart.">
<meta name="tags" content="kpi, chart, sample">
<meta name="date" content="2026-11-05">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#eef2ff;color:#1e1b4b;padding:50px 70px}
h1{margin:0 0 24px;font-size:42px}.row{display:flex;gap:20px}.c{flex:1;background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 18px rgba(79,70,229,.12)}
.c b{display:block;font-size:38px;color:#4f46e5}.bars{display:flex;align-items:flex-end;gap:14px;height:240px;margin-top:24px;background:#fff;border-radius:18px;padding:24px}
.bars i{flex:1;background:linear-gradient(#818cf8,#4f46e5);border-radius:8px 8px 0 0}
</style></head>
<body><h1>Q3 Metrics</h1>
<div class="row"><div class="c"><b>$1.2M</b>Revenue</div><div class="c"><b>18.4k</b>Active users</div><div class="c"><b>96%</b>Uptime</div></div>
<div class="bars"><i style="height:40%"></i><i style="height:55%"></i><i style="height:48%"></i><i style="height:70%"></i><i style="height:82%"></i><i style="height:95%"></i></div></body></html>
